interface=en13
except-interface=lo0
bind-interfaces
user=nobody
# macOS has no dip group (dnsmasq default)
group=nobody

dhcp-range=192.168.10.100,192.168.10.150,255.255.255.0,12h
dhcp-option=option:router,192.168.10.1
dhcp-option=option:dns-server,192.168.10.1
dhcp-leasefile=/opt/homebrew/var/lib/misc/dnsmasq/dnsmasq.leases

enable-tftp
tftp-root=/opt/homebrew/var/lib/tftp
# iPXE identifies itself with DHCP option 175.
dhcp-match=set:ipxe,175
dhcp-boot=tag:!ipxe,snponly.efi
dhcp-boot=tag:ipxe,https://pxe.factory.talos.dev/pxe/05bdd018b977b3419c717ae2dac043e6fee9317ad93ce22a4569dc3c8aaa8aed/v1.14.5/metal-amd64

dhcp-host=78:55:36:09:6b:c2,motoko-01,192.168.10.11
dhcp-host=78:55:36:09:6d:3f,batou-02,192.168.10.12
dhcp-host=78:55:36:09:6b:4e,togusa-03,192.168.10.13
